<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../public/app.css">
<style>
body{margin:0;width:1200px;height:630px;background:#f8f4ea;display:flex;align-items:center;justify-content:center;overflow:hidden}
.box{width:1120px;height:550px;border:6px solid #1c2240;outline:2px solid #1c2240;outline-offset:-20px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:0 60px;gap:40px}
h1{font-size:76px;margin:0 0 18px}
p{font-size:30px;color:#3a4064;margin:0}
.brand{font-size:40px;margin-bottom:26px}
.brand img{width:56px;height:56px}
.mini{background:#fffdf8;border:1px solid #e4dccb;border-radius:22px;padding:30px;text-align:center;transform:rotate(2deg);box-shadow:0 20px 40px -20px rgba(28,34,64,.4)}
.mini .head{font-family:var(--serif);font-size:42px;font-weight:700;margin:10px 0}
.mini .stamp{font-size:24px;animation:none}
.split{height:22px}
</style></head><body><div class="box">
<div><div class="brand"><img src="../public/icon.svg" alt="">Jurybox</div><h1>Settle it. Let your friends be the jury.</h1><p>Both sides write their case. The group chat votes in secret.</p></div>
<div class="mini"><div class="ruled" style="font:800 18px var(--sans);letter-spacing:.2em;color:#6a6e80">THE JURY HAS RULED</div><div class="head">Maya is right (7–2)</div><span class="stamp">MAJORITY</span><div class="split"><span class="a" style="width:78%"></span><span class="b" style="width:22%"></span></div><div class="quote" style="font-size:26px">“That’s not soaking, that’s storage.”</div></div>
</div></body></html>
